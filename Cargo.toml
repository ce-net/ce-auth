[package]
name = "ce-auth"
version = "0.1.0"
edition = "2024"
description = "ce-auth — the operator's mesh-native, capability-minting auth/SSO service for CE. Owns the operator's device registry and answers \"is this device the operator?\" over the mesh; on a valid enrolled-device proof it MINTS an attenuating ce-cap grant (via ce-iam) bound to the device's CE NodeId + the requesting app audience, which relying-party apps verify OFFLINE with ce-cap. A thin local HTTP server serves only the operator console."

[[bin]]
name = "ce-auth"
path = "src/main.rs"

[lib]
name = "ce_auth"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "fs"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

# Device auth (ce-secrets P-256 challenge-response).
ce-secrets-rs = { path = "../ce-secrets-rs" }
# The cap bridge: mint/attenuate/verify attenuating ce-cap chains via the IAM tier.
# ce-iam is a workspace; the full-IAM package (with the device->cap bridge) is crates/ce-iam.
ce-iam = { path = "../ce-iam/crates/ce-iam" }
ce-iam-core = { path = "../ce-iam/crates/ce-iam-core" }
ce-identity = { path = "../ce/crates/ce-identity" }
# Mesh-native serve/locate + node client (the substrate this service rides).
ce-rs = { path = "../ce-rs", features = ["serve", "locate"] }
directories = "5"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = 2
strip = true
