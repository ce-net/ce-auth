# ce-auth — operator's mesh-native, capability-minting auth/SSO service. Installed + supervised by the one `ce` node via ce-appmgr.

[app]
name    = "ce-auth"
version = "0.1.0"
summary = "Mesh-native cap-minting auth/SSO: enrolled-device proof -> attenuating ce-cap grant; thin operator console."
runtime = "native"
publisher = "c0be11e0ce0aaa769da6f9970244947d3d32a0c0d8302fb5f41f73d7950be456"
provides = ["auth"]

[native]
bin = "ce-auth"
[native.artifacts]
"darwin-amd64" = "PLACEHOLDER_darwin_amd64"
"linux-amd64"  = "PLACEHOLDER_linux_amd64"

[deps]
# Drives the local ce node (ce-rs serve/locate); mints/verifies ce-cap chains via ce-iam.

[sandbox]
tier       = "none"
net        = "none"
capability = "inherit"

[daemon]
# Bare binary runs the mesh service + thin operator console; no subcommand.
enabled = true
restart = "on-failure"
